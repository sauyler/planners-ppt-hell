<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整套 PPT 审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:#eff2f4;color:#17242b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{height:62px;background:#112b35;color:white;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}header small{color:#b7c8cd}.workspace{height:calc(100vh - 130px);display:grid;grid-template-columns:130px minmax(250px,1fr) 330px;gap:16px;padding:16px}.rail,.panel{overflow:auto;scrollbar-width:none}.rail::-webkit-scrollbar,.panel::-webkit-scrollbar{display:none}.rail button{display:block;width:100%;padding:8px;border:2px solid transparent;background:white;margin-bottom:8px}.rail img{width:100%;display:block}.rail .active{border-color:#235c70}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#929ca0;margin-right:8px}.approved .dot{background:#138357}.revise .dot{background:#cb741d}.stage{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}.stage h2{align-self:start;font-size:18px;margin:0 0 12px}.preview{position:relative;width:100%;line-height:0;max-height:calc(100% - 72px);aspect-ratio:16/9}.preview img{width:100%;height:100%;object-fit:contain;background:white;user-select:none}.preview.marking{cursor:crosshair;touch-action:none}.box{position:absolute;border:2px solid #e78421;background:#ffbb3325;pointer-events:none}.panel{background:white;border-radius:8px;padding:16px}.panel textarea{width:100%;height:90px;resize:vertical;font:inherit}.panel h3{margin:12px 0 8px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #b9c6cb;border-radius:5px;padding:8px 12px;background:white;color:#17242b}button.primary{background:#235c70;color:white;border-color:#235c70}button.good{background:#138357;color:white}button:disabled{opacity:.45;cursor:default}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.muted{color:#6c7d84;font-size:12px}.asset{border:1px solid #d6dfe2;padding:10px;margin:8px 0;border-radius:6px}.asset img{display:block;width:100%;height:100%;object-fit:contain}.crop{height:130px;background:#edf1f2;margin:8px 0}.asset select,.asset input[type=text]{width:100%;margin:3px 0;padding:6px}.asset input[type=file]{width:100%;font-size:12px}.drop{border:2px dashed #aebfc6;padding:16px;text-align:center;margin:8px 0}.annotation{border-bottom:1px solid #eee;padding:6px 0}footer{height:68px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:white;border-top:1px solid #ccd7db}dialog{border:0;border-radius:12px;padding:26px;width:min(550px,90vw);box-shadow:0 20px 90px #0005}dialog::backdrop{background:#112b3580}dialog textarea{width:100%;min-height:100px;font:inherit;padding:8px}#message{color:#9c401b;max-width:55vw}#regions{max-height:180px;overflow:auto}.history{padding:6px}#regionNote{width:100%}@media(max-width:950px){.workspace{grid-template-columns:80px minmax(150px,1fr) 250px;gap:8px;padding:8px}header small{display:none}.panel{padding:10px}}
</style>
<header><b id="project"></b><small>Planner’s PPT Hell · 阿祖不看 TVC · demyth.info</small></header>
<div class="workspace"><nav class="rail" id="rail"></nav><section class="stage"><h2 id="title"></h2><div class="preview" id="preview"><img id="slide" draggable="false" alt="当前幻灯片"><div id="selection" class="box" hidden></div></div><div class="history"><button id="compare" onclick="togglePrevious()">查看修改前</button></div></section><aside class="panel"><div class="tools"><button id="mark" onclick="startRegion()">框选问题</button><button onclick="clearRegions()">清空框选</button></div><div id="regions"></div><h3>本页反馈</h3><textarea id="feedback" placeholder="说明希望调整什么"></textarea><h3>本页图片</h3><p class="muted">可替换、拖入或粘贴图片。裁剪预览是修改要求；提交后由 Agent 调整实际页面。</p><div id="assets"></div><div class="drop" id="addDrop" tabindex="0">新增图片：点击、拖入或粘贴<input id="newFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><p id="pageStatus" class="muted"></p></aside></div>
<footer><div class="tools"><button onclick="go(-1)">上一页</button><button onclick="go(1)">下一页</button><button onclick="decide('revise')">标记修改</button><button class="good" onclick="decide('approved')">批准当前页</button></div><span id="message"></span><button class="primary" onclick="showSubmit()">提交本轮审阅</button></footer>
<dialog id="submitDialog"><h2>提交本轮审阅</h2><p id="stats"></p><textarea id="overall" placeholder="整套修改意见（可选；填写后需 Agent 处理）"></textarea><p class="muted">“批准未处理页”保留已有待修改页。提交不会覆盖它们。</p><div class="tools"><button onclick="submitReview(false)">提交已有决定</button><button class="good" onclick="submitReview(true)">批准未处理页并提交</button><button onclick="document.querySelector('#submitDialog').close()">返回</button></div><p id="submitMessage"></p></dialog>
<dialog id="regionDialog"><h3>这个区域需要怎么改？</h3><textarea id="regionNote"></textarea><div class="tools"><button onclick="saveRegion()">保存标注</button><button onclick="cancelRegion()">取消</button></div></dialog>
<script>
const data=__DATA__;let index=0,marking=false,start=null,rect=null,previous=false,uploads=0;
const $=s=>document.querySelector(s), page=()=>data.pages[index];
const state=Object.fromEntries(data.pages.map(p=>[p.key,{decision:p.decision,feedback:'',annotations:[],assets:[]}]))
const initial=structuredClone(state);const labels={pending:'未处理',approved:'人工批准',revise:'要求修改'};
$('#project').textContent=data.project+' · 整套审阅';
function changed(p){const s=state[p.key];return !!(s.feedback.trim()||s.annotations.length||s.assets.length)}
function autoState(){const p=page(),s=state[p.key];s.decision=changed(p)?'revise':initial[p.key].decision;drawRail();status()}
function status(){$('#pageStatus').textContent=labels[state[page().key].decision]}
function drawRail(){const rail=$('#rail');rail.replaceChildren();data.pages.forEach((p,i)=>{const b=document.createElement('button');b.className=state[p.key].decision+(i===index?' active':'');const img=document.createElement('img');img.src=p.png;img.alt='第 '+(i+1)+' 页';b.append(img);const t=document.createElement('span');const d=document.createElement('span');d.className='dot';t.append(d,document.createTextNode(String(i+1)));b.append(t);b.onclick=()=>{index=i;render()};rail.append(b)})}
function render(){marking=false;previous=false;$('#preview').classList.remove('marking');$('#selection').hidden=true;const p=page(),s=state[p.key];$('#title').textContent=(index+1)+' / '+data.pages.length+' · '+p.title;$('#slide').src=p.png;$('#feedback').value=s.feedback;$('#compare').disabled=!p.previous;$('#compare').textContent='查看修改前';drawRail();drawAssets();drawRegions();status()}
function go(d){index=Math.max(0,Math.min(data.pages.length-1,index+d));render()}
$('#feedback').oninput=e=>{state[page().key].feedback=e.target.value;autoState()};
function decide(value){if(value==='approved'&&changed(page())){$('#message').textContent='本页仍有修改意见；清除修改后才能批准。';return}state[page().key].decision=value;drawRail();status()}
function togglePrevious(){previous=!previous;$('#slide').src=previous?page().previous:page().png;$('#compare').textContent=previous?'查看当前版本':'查看修改前';marking=false;$('#selection').hidden=true}
function startRegion(){if(previous)togglePrevious();marking=true;$('#preview').classList.add('marking');$('#message').textContent='在页面上拖出需要修改的区域'}
function point(e){const r=$('#preview').getBoundingClientRect();return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
$('#preview').onpointerdown=e=>{if(!marking)return;start=point(e);$('#preview').setPointerCapture(e.pointerId)};
$('#preview').onpointermove=e=>{if(!start)return;const end=point(e);rect={x:Math.min(start.x,end.x),y:Math.min(start.y,end.y),w:Math.abs(end.x-start.x),h:Math.abs(end.y-start.y)};const b=$('#selection');b.hidden=false;Object.assign(b.style,{left:rect.x*100+'%',top:rect.y*100+'%',width:rect.w*100+'%',height:rect.h*100+'%'})};
$('#preview').onpointerup=()=>{if(!start)return;start=null;marking=false;$('#preview').classList.remove('marking');if(rect&&rect.w>.005&&rect.h>.005){$('#regionNote').value='';$('#regionDialog').showModal()}else $('#selection').hidden=true};
function cancelRegion(){$('#regionDialog').close();$('#selection').hidden=true;rect=null}
function saveRegion(){const text=$('#regionNote').value.trim();if(!text)return;state[page().key].annotations.push({...rect,text});cancelRegion();drawRegions();autoState()}
function clearRegions(){state[page().key].annotations=[];drawRegions();autoState()}
function drawRegions(){const container=$('#regions');container.replaceChildren();state[page().key].annotations.forEach((a,i)=>{const d=document.createElement('div');d.className='annotation';d.textContent=(i+1)+'. '+a.text;const b=document.createElement('button');b.textContent='删除';b.onclick=()=>{state[page().key].annotations.splice(i,1);drawRegions();autoState()};d.append(b);container.append(d)})}
function assetState(a){return state[page().key].assets.find(x=>x.asset_key===a.asset_key)||{...a,operation:'crop',ratio:'original',anchor:'center'}}
function setAsset(a,item){const s=state[page().key];s.assets=s.assets.filter(x=>x.asset_key!==a.asset_key);const unchanged=item.operation==='crop'&&item.path===a.path&&item.fit===a.fit&&item.ratio==='original'&&item.anchor==='center';if(!unchanged)s.assets.push(item);autoState()}
function drawAssets(){const wrap=$('#assets');wrap.replaceChildren();const p=page();const added=state[p.key].assets.filter(a=>a.operation==='add');[...p.assets,...added].forEach(a=>{let item=assetState(a);const box=document.createElement('div');box.className='asset';const name=document.createElement('b');name.textContent=a.asset_key;box.append(name);const crop=document.createElement('div');crop.className='crop';const img=document.createElement('img');img.src='/'+item.path;crop.append(img);box.append(crop);
const fit=document.createElement('select');for(const [v,t] of [['contain','完整显示'],['cover','填满并裁剪']]){const o=new Option(t,v);fit.add(o)}fit.value=item.fit;const ratio=document.createElement('input');ratio.type='text';ratio.value=item.ratio||'original';ratio.placeholder='original 或 16:9';const anchor=document.createElement('select');for(const [v,t] of [['center','居中'],['top','靠上'],['bottom','靠下'],['left','靠左'],['right','靠右']])anchor.add(new Option(t,v));anchor.value=item.anchor||'center';
function preview(){img.style.objectFit=fit.value;img.style.objectPosition=anchor.value;const parts=ratio.value.split(':').map(Number);crop.style.aspectRatio=parts.length===2&&parts.every(n=>n>0)?parts.join('/'):(a.width&&a.height?a.width+'/'+a.height:'16/9');crop.style.height='auto'}
function change(){item={...item,fit:fit.value,ratio:ratio.value,anchor:anchor.value};setAsset(a,item);preview()}fit.onchange=change;ratio.onchange=change;anchor.onchange=change;box.append(fit,ratio,anchor);preview();const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp,image/gif';input.onchange=()=>input.files[0]&&upload(input.files[0],a.asset_key,false);box.append(input);box.ondragover=e=>e.preventDefault();box.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0],a.asset_key,false)};box.tabIndex=0;box.onpaste=e=>{const file=[...e.clipboardData.items].find(x=>x.kind==='file')?.getAsFile();if(file){e.preventDefault();upload(file,a.asset_key,false)}};const reset=document.createElement('button');reset.textContent=a.operation==='add'?'移除新增图片':'重置修改';reset.onclick=()=>{state[p.key].assets=state[p.key].assets.filter(x=>x.asset_key!==a.asset_key);drawAssets();autoState()};box.append(reset);wrap.append(box)})}
async function upload(file,key,isNew){const p=page(),targetKey=p.key;uploads++;$('#message').textContent='上传中…';try{const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const response=await fetch('/review-asset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_key:targetKey,asset_key:key,filename:file.name,data_base64:base64})});const result=await response.json();if(!response.ok)throw Error(result.error);const existing=state[targetKey].assets.find(x=>x.asset_key===key);state[targetKey].assets=state[targetKey].assets.filter(x=>x.asset_key!==key);state[targetKey].assets.push({asset_key:key,operation:isNew||existing?.operation==='add'?'add':'replace',path:result.path,fit:'contain',ratio:'original',anchor:'center'});state[targetKey].decision='revise';if(page().key===targetKey)drawAssets();drawRail();status();$('#message').textContent='图片已上传，提交后更新页面'}catch(e){$('#message').textContent=e.message}finally{uploads--}}
const drop=$('#addDrop');drop.onclick=e=>{if(e.target!==$('#newFile'))$('#newFile').click()};drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0],'new_'+crypto.randomUUID(),true)};drop.onpaste=e=>{const f=[...e.clipboardData.items].find(x=>x.kind==='file')?.getAsFile();if(f){e.preventDefault();upload(f,'new_'+crypto.randomUUID(),true)}};$('#newFile').onchange=e=>{if(e.target.files[0])upload(e.target.files[0],'new_'+crypto.randomUUID(),true);e.target.value=''};
function showSubmit(){const values=Object.values(state);$('#stats').textContent=['approved','revise','pending'].map(s=>labels[s]+' '+values.filter(x=>x.decision===s).length+' 页').join(' / ');$('#submitDialog').showModal()}
async function submitReview(approvePending){if(uploads){$('#submitMessage').textContent='请等待图片上传完成';return}const payload=structuredClone(state);if(approvePending)for(const p of Object.values(payload))if(p.decision==='pending')p.decision='approved';try{const r=await fetch('/review-feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_id:data.review_id,pages:payload,overall_feedback:$('#overall').value})});const result=await r.json();if(!r.ok)throw Error(result.error);Object.assign(state,payload);drawRail();$('#submitMessage').textContent=result.message;$('#message').textContent=result.message}catch(e){$('#submitMessage').textContent=e.message}}
function sizePreview(){const stage=$('.stage'),box=$('#preview');box.style.width=Math.max(80,Math.min(stage.clientWidth,(stage.clientHeight-85)*16/9))+'px'}window.addEventListener('resize',sizePreview);$('#slide').onload=sizePreview;sizePreview();
window.addEventListener('beforeunload',e=>{if(Object.values(state).some(x=>x.feedback||x.assets.length||x.annotations.length)){e.preventDefault();e.returnValue=''}});render();
</script></html>
