<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Minimal Header -->
  <g id="left-header">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">AXES</text>
  </g>

  <!-- Main Art Stage: 8-Petal Spectrum Dial (Direct Pin 09 Geometry) -->
  <g id="petal-dial-art" transform="translate(1300, 500)">
    
    <!-- Outer Circular Guideline -->
    <circle cx="0" cy="0" r="250" fill="none" stroke="#161A20" stroke-width="1" stroke-dasharray="2 4" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="#21262D" stroke-width="1" />

    <!-- 8 Distinct Rounded Petal Lobes Radiating Out -->
    <!-- Petal 1: Top (0 deg) -->
    <g transform="rotate(0)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#FFFFFF" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#08090C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
    </g>

    <!-- Petal 2: Top-Right (45 deg) -->
    <g transform="rotate(45)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#E2E5EB" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#08090C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
    </g>

    <!-- Petal 3: Right (90 deg) -->
    <g transform="rotate(90)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#C0C5CE" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#08090C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
    </g>

    <!-- Petal 4: Bottom-Right (135 deg) -->
    <g transform="rotate(135)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#9CA2AB" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#08090C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04</text>
    </g>

    <!-- Petal 5: Bottom (180 deg) -->
    <g transform="rotate(180)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#6B7280" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05</text>
    </g>

    <!-- Petal 6: Bottom-Left (225 deg) -->
    <g transform="rotate(225)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#4B5563" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">06</text>
    </g>

    <!-- Petal 7: Left (270 deg) -->
    <g transform="rotate(270)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#374151" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">07</text>
    </g>

    <!-- Petal 8: Top-Left (315 deg) -->
    <g transform="rotate(315)">
      <path d="M -35 -60 C -50 -120, -38 -200, 0 -200 C 38 -200, 50 -120, 35 -60 Z" fill="#1F2937" />
      <text x="0" y="-140" text-anchor="middle" font-size="22" font-weight="800" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">08</text>
    </g>

    <!-- Center Hub Hole with Tag -->
    <circle cx="0" cy="0" r="55" fill="#08090C" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">8-AXIS</text>

  </g>
</svg>
