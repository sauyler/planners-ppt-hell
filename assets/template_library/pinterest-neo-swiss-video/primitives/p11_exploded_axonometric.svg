<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Minimal Header -->
  <g id="header-block">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">ASSEMBLY</text>
  </g>

  <!-- Main Art Stage: Exploded Axonometric Blueprint (Direct Pin 15 Geometry) -->
  <g id="axonometric-stage">
    
    <!-- Central Exploded Axis Alignment Guide Lines -->
    <g stroke="#383E47" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
      <!-- Center vertical axis through all layers -->
      <line x1="1200" y1="210" x2="1200" y2="760" />
      <!-- Four corner exploded alignment axes -->
      <line x1="1020" y1="290" x2="1020" y2="720" />
      <line x1="1380" y1="290" x2="1380" y2="720" />
      <line x1="1200" y1="230" x2="1200" y2="670" />
      <line x1="1200" y1="350" x2="1200" y2="770" />
    </g>

    <!-- Layer 01: Top Enclosure Lid (x_center: 1200, y_center: 270) -->
    <g id="layer-01-lid">
      <!-- Isometric Diamond Top Face -->
      <polygon points="1200,210 1380,265 1200,320 1020,265" fill="#12151B" stroke="#FFFFFF" stroke-width="1.4" />
      <!-- Thickness Rim -->
      <polygon points="1020,265 1200,320 1200,328 1020,273" fill="#1A1F27" stroke="#FFFFFF" stroke-width="1.2" />
      <polygon points="1200,320 1380,265 1380,273 1200,328" fill="#161A22" stroke="#FFFFFF" stroke-width="1.2" />
      <!-- Corner Mounting Screw Holes -->
      <circle cx="1060" cy="265" r="3" fill="#08090C" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="1340" cy="265" r="3" fill="#08090C" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="1200" cy="230" r="3" fill="#08090C" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="1200" cy="300" r="3" fill="#08090C" stroke="#FFFFFF" stroke-width="1" />
      <!-- Center Aperture -->
      <ellipse cx="1200" cy="265" rx="42" ry="14" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="2 3" />
      <!-- Label Leader Line -->
      <line x1="1380" y1="265" x2="1480" y2="265" stroke="#484F58" stroke-width="1" />
      <text x="1500" y="271" font-size="16" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 / CHASSIS</text>
    </g>

    <!-- Layer 02: Core Optical Sensor Array Disc (x_center: 1200, y_center: 410) -->
    <g id="layer-02-optics">
      <!-- Outer Isometric Ring -->
      <ellipse cx="1200" cy="410" rx="130" ry="42" fill="#0D1016" stroke="#FFFFFF" stroke-width="1.4" />
      <ellipse cx="1200" cy="410" rx="95" ry="30" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="3 3" />
      <ellipse cx="1200" cy="410" rx="55" ry="18" fill="#1C2128" stroke="#38BDF8" stroke-width="1.2" />
      <!-- Concentric Center Lens Dot -->
      <circle cx="1200" cy="410" r="4" fill="#38BDF8" />
      <!-- Crosshair reticle lines -->
      <line x1="1070" y1="410" x2="1330" y2="410" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 4" />
      <line x1="1200" y1="368" x2="1200" y2="452" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 4" />
      <!-- Label Leader Line -->
      <line x1="1330" y1="410" x2="1480" y2="410" stroke="#484F58" stroke-width="1" />
      <text x="1500" y="416" font-size="16" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 / OPTICS</text>
    </g>

    <!-- Layer 03: Precision Circuit PCB Substrate (x_center: 1200, y_center: 550) -->
    <g id="layer-03-pcb">
      <!-- Isometric Diamond PCB Board -->
      <polygon points="1200,490 1380,545 1200,600 1020,545" fill="#0E1218" stroke="#FFFFFF" stroke-width="1.2" />
      <!-- Hairline Circuit Traces -->
      <path d="M 1080 545 L 1140 545 L 1170 525 L 1230 525" fill="none" stroke="#484F58" stroke-width="1" />
      <path d="M 1200 575 L 1200 555 L 1240 555 L 1280 540" fill="none" stroke="#484F58" stroke-width="1" />
      <path d="M 1120 535 L 1160 560 L 1210 560" fill="none" stroke="#484F58" stroke-width="1" />
      <!-- Contact Node Dots -->
      <circle cx="1230" cy="525" r="2.5" fill="#FFFFFF" />
      <circle cx="1280" cy="540" r="2.5" fill="#FFFFFF" />
      <circle cx="1210" cy="560" r="2.5" fill="#FFFFFF" />
      <circle cx="1140" cy="545" r="2.5" fill="#FFFFFF" />
      <!-- Central Processing Core Rect in Isometric Projection -->
      <polygon points="1200,535 1230,545 1200,555 1170,545" fill="#FFFFFF" />
      <!-- Label Leader Line -->
      <line x1="1380" y1="545" x2="1480" y2="545" stroke="#484F58" stroke-width="1" />
      <text x="1500" y="551" font-size="16" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 / MATRIX</text>
    </g>

    <!-- Layer 04: Solid Chassis Base Housing (x_center: 1200, y_center: 690) -->
    <g id="layer-04-base">
      <!-- Top Rim of Base -->
      <polygon points="1200,630 1380,685 1200,740 1020,685" fill="#141820" stroke="#FFFFFF" stroke-width="1.4" />
      <!-- Deep 3D Extruded Body Walls -->
      <polygon points="1020,685 1200,740 1200,775 1020,720" fill="#1A1F28" stroke="#FFFFFF" stroke-width="1.4" />
      <polygon points="1200,740 1380,685 1380,720 1200,775" fill="#10141A" stroke="#FFFFFF" stroke-width="1.4" />
      <!-- Inner Cavity Recess -->
      <polygon points="1200,650 1340,692 1200,735 1060,692" fill="#08090C" stroke="#383E47" stroke-width="1" stroke-dasharray="3 3" />
      <!-- Label Leader Line -->
      <line x1="1380" y1="700" x2="1480" y2="700" stroke="#484F58" stroke-width="1" />
      <text x="1500" y="706" font-size="16" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 / BASE</text>
    </g>

  </g>
</svg>
