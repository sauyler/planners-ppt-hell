<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Minimal Header -->
  <g id="header-block">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">TERMINAL</text>
  </g>

  <!-- Main Art Stage: Retro CRT Terminal Interface (Direct Pin 12 Replicas) -->
  <g id="terminal-stage">
    
    <!-- Outer Terminal Enclosure Frame -->
    <rect x="960" y="240" width="760" height="540" fill="#0A0C10" stroke="#21262D" stroke-width="1.2" />
    
    <!-- Fine 1px Grid Lines Inside Terminal -->
    <g stroke="#141820" stroke-width="1" opacity="0.8">
      <line x1="960" y1="320" x2="1720" y2="320" />
      <line x1="960" y1="400" x2="1720" y2="400" />
      <line x1="960" y1="480" x2="1720" y2="480" />
      <line x1="960" y1="560" x2="1720" y2="560" />
      <line x1="960" y1="640" x2="1720" y2="640" />
      <line x1="960" y1="720" x2="1720" y2="720" />

      <line x1="1080" y1="240" x2="1080" y2="780" />
      <line x1="1200" y1="240" x2="1200" y2="780" />
      <line x1="1320" y1="240" x2="1320" y2="780" />
      <line x1="1440" y1="240" x2="1440" y2="780" />
      <line x1="1560" y1="240" x2="1560" y2="780" />
      <line x1="1680" y1="240" x2="1680" y2="780" />
    </g>

    <!-- Top Status Readout Bar -->
    <text x="1000" y="285" font-size="13" font-weight="700" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">SYSTEM.01 // READY</text>
    <circle cx="1680" cy="280" r="4" fill="#38BDF8" />

    <!-- Terminal Menu Options (Direct Pin 12 Replicas) -->

    <!-- Option 01: [ START ] -->
    <g id="opt-start">
      <rect x="1100" y="360" width="480" height="72" fill="#0E1218" stroke="#383E47" stroke-width="1.2" />
      <text x="1340" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="4">[ START ]</text>
    </g>

    <!-- Option 02: [ CONFIGURE ] (Active Highlighted Amber State - Pin 12 iconic visual) -->
    <g id="opt-configure">
      <!-- Amber Glowing Highlight Container -->
      <rect x="1100" y="475" width="480" height="76" fill="#1C180E" stroke="#F5A623" stroke-width="1.8" />
      <!-- Corner Crosshair Accent Marks on Amber Box -->
      <path d="M 1092 475 L 1108 475 M 1100 467 L 1100 483" stroke="#F5A623" stroke-width="1.5" />
      <path d="M 1572 475 L 1588 475 M 1580 467 L 1580 483" stroke="#F5A623" stroke-width="1.5" />
      <path d="M 1092 551 L 1108 551 M 1100 543 L 1100 559" stroke="#F5A623" stroke-width="1.5" />
      <path d="M 1572 551 L 1588 551 M 1580 543 L 1580 559" stroke="#F5A623" stroke-width="1.5" />
      <!-- Active Text -->
      <text x="1340" y="522" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="4">[ CONFIGURE ]</text>
      <!-- Active Selector Caret on Left -->
      <polygon points="1070,513 1085,503 1085,523" fill="#F5A623" />
    </g>

    <!-- Option 03: [ QUIT ] -->
    <g id="opt-quit">
      <rect x="1100" y="595" width="480" height="72" fill="#0E1218" stroke="#383E47" stroke-width="1.2" />
      <text x="1340" y="640" text-anchor="middle" font-size="20" font-weight="700" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="4">[ QUIT ]</text>
    </g>

    <!-- Bottom Terminal Command Prompt Bar -->
    <text x="1000" y="745" font-size="12" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">PROMPT > SELECT OPTION [ENTER]</text>

  </g>
</svg>
