<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Left Header (Direct Pin 03 "User research" Title) -->
  <!-- Minimal Header -->
  <g id="header-block">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">RESEARCH</text>
  </g>

  <!-- Main Art Stage: 3 Circular Dotted Gauge Rings (33%, 48%, 67%) -->
  <g id="gauges-stage">
    
    <!-- Gauge 01: 33% -->
    <g id="gauge-33" transform="translate(900, 480)">
      <!-- Outer Track (Inactive dots) -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#21262D" stroke-width="6" stroke-dasharray="2 6" />
      <!-- Active Segment 33% (approx 120 deg) with Cyan Accent -->
      <path d="M 0 -105 A 105 105 0 0 1 91 53" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="2 6" />
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#161A20" stroke-width="1" stroke-dasharray="2 4" />
      <!-- Big Numeral -->
      <text x="0" y="18" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-1">33%</text>
      <!-- Sub-label below -->
      <text x="0" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">INPUT</text>
    </g>

    <!-- Gauge 02: 48% -->
    <g id="gauge-48" transform="translate(1240, 480)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#21262D" stroke-width="6" stroke-dasharray="2 6" />
      <!-- Active Segment 48% (approx 172 deg) with Cyan Accent -->
      <path d="M 0 -105 A 105 105 0 0 1 13 104" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="2 6" />
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#161A20" stroke-width="1" stroke-dasharray="2 4" />
      <!-- Big Numeral -->
      <text x="0" y="18" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-1">48%</text>
      <!-- Sub-label below -->
      <text x="0" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">PROCESS</text>
    </g>

    <!-- Gauge 03: 67% -->
    <g id="gauge-67" transform="translate(1580, 480)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#21262D" stroke-width="6" stroke-dasharray="2 6" />
      <!-- Active Segment 67% (approx 240 deg) with Cyan Accent -->
      <path d="M 0 -105 A 105 105 0 1 1 -91 53" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="2 6" />
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="82" fill="none" stroke="#161A20" stroke-width="1" stroke-dasharray="2 4" />
      <!-- Big Numeral -->
      <text x="0" y="18" text-anchor="middle" font-size="56" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-1">67%</text>
      <!-- Sub-label below -->
      <text x="0" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">OUTPUT</text>
    </g>

  </g>
</svg>
