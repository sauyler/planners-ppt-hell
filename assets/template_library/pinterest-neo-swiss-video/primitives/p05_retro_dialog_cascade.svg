<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Minimal Header -->
  <g id="left-header">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">ALERT</text>
  </g>

  <!-- Main Art Stage: Directly Replicating Pin 29 Cascading Windows -->
  <g id="dialog-cascade-stage">
    <!-- Back Window 1 -->
    <g id="win-01" opacity="0.3">
      <rect x="940" y="220" width="600" height="360" fill="#08090C" stroke="#252A33" stroke-width="1" />
      <line x1="940" y1="252" x2="1540" y2="252" stroke="#252A33" stroke-width="1" />
    </g>

    <!-- Back Window 2 -->
    <g id="win-02" opacity="0.45">
      <rect x="980" y="260" width="600" height="360" fill="#08090C" stroke="#30363D" stroke-width="1" />
      <line x1="980" y1="292" x2="1580" y2="292" stroke="#30363D" stroke-width="1" />
    </g>

    <!-- Back Window 3 -->
    <g id="win-03" opacity="0.65">
      <rect x="1020" y="300" width="600" height="360" fill="#08090C" stroke="#484F58" stroke-width="1.2" />
      <line x1="1020" y1="332" x2="1620" y2="332" stroke="#484F58" stroke-width="1" />
    </g>

    <!-- Back Window 4 -->
    <g id="win-04" opacity="0.85">
      <rect x="1060" y="340" width="600" height="360" fill="#08090C" stroke="#8B949E" stroke-width="1.2" />
      <line x1="1060" y1="372" x2="1660" y2="372" stroke="#8B949E" stroke-width="1" />
    </g>

    <!-- Front Active Window 5 (Crisp 1px White Wireframe with Titlebar and Action Buttons) -->
    <g id="win-front">
      <!-- Window Body -->
      <rect x="1100" y="380" width="660" height="380" fill="#08090C" stroke="#FFFFFF" stroke-width="1.8" />
      
      <!-- Retro Title Bar -->
      <rect x="1100" y="380" width="660" height="36" fill="#161A20" stroke="#FFFFFF" stroke-width="1.2" />
      <!-- Window Close Box on Left -->
      <rect x="1112" y="391" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
      <!-- Window Title -->
      <text x="1140" y="403" font-size="12" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Problem.alert // SYSTEM_01</text>

      <!-- Inside Dialog Content (Direct Pin 29 Typography Layout) -->
      <text x="1140" y="470" font-size="34" font-weight="900" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">Problem:</text>
      <text x="1140" y="525" font-size="20" font-weight="600" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">Uncertainty detected in domain model.</text>

      <line x1="1140" y1="585" x2="1720" y2="585" stroke="#1C2128" stroke-width="1" />

      <!-- Action Buttons (Direct Pin 29 Replicas: [ Ignore ] & [ Solve ]) -->
      <!-- Ignore Button -->
      <rect x="1460" y="660" width="110" height="42" fill="none" stroke="#484F58" stroke-width="1.2" />
      <text x="1515" y="686" text-anchor="middle" font-size="13" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ignore</text>

      <!-- Solve Button (High contrast solid button) -->
      <rect x="1590" y="660" width="130" height="42" fill="#FFFFFF" />
      <text x="1655" y="686" text-anchor="middle" font-size="13" font-weight="800" fill="#08090C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Solve</text>
    </g>
  </g>
</svg>
