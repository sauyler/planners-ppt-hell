<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Minimal Header -->
  <g id="header-block">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">SPECTRUM</text>
  </g>

  <!-- Main Art Stage: Directly Replicating Pin 08 Ray Fan -->
  <g id="ray-fan-stage">
    
    <!-- Origin Node (x=880, y=280) -->
    <circle cx="880" cy="280" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="880" cy="280" r="5" fill="#FFFFFF" />

    <!-- Outer Concentric Dashed Guide Arc -->
    <path d="M 1600 280 A 720 720 0 0 1 1130 950" fill="none" stroke="#21262D" stroke-width="1" stroke-dasharray="3 4" />

    <!-- 12 Rays with Crisp 1-word Labels (Direct Pin 08 Design) -->
    <g transform="rotate(0 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="1600" cy="280" r="2.5" fill="#FFFFFF" />
      <text x="1250" y="272" font-size="14" font-weight="700" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">00° / DOMAIN</text>
    </g>

    <g transform="rotate(6 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#E6EDF3" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#FFFFFF" />
      <text x="1250" y="272" font-size="14" font-weight="700" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">06° / LATENT</text>
    </g>

    <g transform="rotate(12 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#C9D1D9" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#FFFFFF" />
      <text x="1250" y="272" font-size="14" font-weight="700" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">12° / ANCHOR</text>
    </g>

    <g transform="rotate(18 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#8B949E" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#8B949E" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">18° / MATRIX</text>
    </g>

    <g transform="rotate(24 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#8B949E" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#8B949E" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">24° / VECTOR</text>
    </g>

    <g transform="rotate(30 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#8B949E" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#8B949E" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">30° / TENSOR</text>
    </g>

    <g transform="rotate(36 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#484F58" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#484F58" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">36° / WEIGHT</text>
    </g>

    <g transform="rotate(42 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#484F58" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#484F58" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">42° / FILTER</text>
    </g>

    <g transform="rotate(48 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#383E47" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#383E47" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">48° / STRATA</text>
    </g>

    <g transform="rotate(54 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#30363D" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#30363D" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">54° / SIGNAL</text>
    </g>

    <g transform="rotate(60 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#252A33" stroke-width="1" />
      <circle cx="1600" cy="280" r="2.5" fill="#252A33" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">60° / PROMPT</text>
    </g>

    <g transform="rotate(66 880 280)">
      <line x1="895" y1="280" x2="1600" y2="280" stroke="#21262D" stroke-width="1" stroke-dasharray="3 3" />
      <circle cx="1600" cy="280" r="2.5" fill="#21262D" />
      <text x="1250" y="272" font-size="14" font-weight="600" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">66° / OUTPUT</text>
    </g>

  </g>
</svg>
