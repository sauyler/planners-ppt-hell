      <line x1="1380" y1="520" x2="1460" y2="700" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="1460" cy="700" r="6" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1380" y2="720" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="1380" cy="720" r="4" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1260" y2="680" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="1260" cy="680" r="5.5" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1180" y2="600" stroke="#FFFFFF" stroke-width="1.2" />
