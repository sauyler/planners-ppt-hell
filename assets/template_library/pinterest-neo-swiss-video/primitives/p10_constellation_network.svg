      <line x1="1500" y1="360" x2="1560" y2="440" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1560" y1="440" x2="1600" y2="520" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1600" y1="520" x2="1540" y2="620" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1540" y1="620" x2="1460" y2="700" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1460" y1="700" x2="1380" y2="720" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1380" y1="720" x2="1260" y2="680" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1260" y1="680" x2="1180" y2="600" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1180" y1="600" x2="1160" y2="520" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
      <line x1="1160" y1="520" x2="1220" y2="400" stroke="#484F58" stroke-width="1" stroke-dasharray="2 3" />
