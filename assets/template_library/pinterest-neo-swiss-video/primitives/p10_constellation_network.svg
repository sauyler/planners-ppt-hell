        <circle cx="1140" cy="440" r="1.5" /><circle cx="1180" cy="440" r="1.5" /><circle cx="1220" cy="440" r="1.5" /><circle cx="1260" cy="440" r="1.5" /><circle cx="1300" cy="440" r="1.5" /><circle cx="1340" cy="440" r="1.5" /><circle cx="1380" cy="440" r="1.5" /><circle cx="1420" cy="440" r="1.5" /><circle cx="1460" cy="440" r="1.5" /><circle cx="1500" cy="440" r="1.5" /><circle cx="1540" cy="440" r="1.5" /><circle cx="1580" cy="440" r="1.5" /><circle cx="1620" cy="440" r="1.5" />
