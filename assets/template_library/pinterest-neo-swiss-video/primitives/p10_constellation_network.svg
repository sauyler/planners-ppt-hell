      <!-- Central Hub Circle -->
      <circle cx="1380" cy="520" r="10" fill="#FFFFFF" />
      <circle cx="1380" cy="520" r="18" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />

      <!-- Primary Radiating Constellation Rays & Satellite Nodes -->
      <line x1="1380" y1="520" x2="1220" y2="400" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="1220" cy="400" r="6" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1260" y2="340" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="1260" cy="340" r="4" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1380" y2="320" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="1380" cy="320" r="5" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1500" y2="360" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="1500" cy="360" r="4.5" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1560" y2="440" stroke="#FFFFFF" stroke-width="1.4" />
      <circle cx="1560" cy="440" r="6" fill="#FFFFFF" />

      <line x1="1380" y1="520" x2="1600" y2="520" stroke="#FFFFFF" stroke-width="1.5" />
