<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- 2x2 Orthogonal Grid Divider Lines (Hairline on pure canvas, NO bento cards!) -->
  <g id="grid-dividers">
    <line x1="700" y1="510" x2="1780" y2="510" stroke="#1C2128" stroke-width="1" />
    <line x1="1240" y1="160" x2="1240" y2="860" stroke="#1C2128" stroke-width="1" />
  </g>

  <!-- Quadrant 1: building blocks (3x3 Circles Matrix) -->
  <g id="quad-01">
    <g id="geo-building-blocks" transform="translate(860, 200)">
      <!-- Row 1 -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="70" cy="0" r="22" fill="#FFFFFF" />
      <circle cx="140" cy="0" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Row 2 -->
      <circle cx="0" cy="70" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="70" cy="70" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="140" cy="70" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Row 3 -->
      <circle cx="0" cy="140" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="70" cy="140" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="140" cy="140" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    <!-- Label -->
    <text x="760" y="440" font-size="34" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">building blocks</text>
  </g>

  <!-- Quadrant 2: team (4 Intersecting Floral Petal Venn Rings) -->
  <g id="quad-02">
    <g id="geo-team" transform="translate(1510, 270)">
      <circle cx="-25" cy="-25" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="25" cy="-25" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-25" cy="25" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="25" cy="25" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
    <!-- Label -->
    <text x="1300" y="440" font-size="34" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">team</text>
  </g>

  <!-- Quadrant 3: cooperation (Figure-8 Overlapping Rings) -->
  <g id="quad-03">
    <g id="geo-cooperation" transform="translate(930, 640)">
      <circle cx="0" cy="-35" r="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="0" cy="35" r="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Central intersection highlight -->
      <path d="M -30 0 A 48 48 0 0 1 30 0 A 48 48 0 0 1 -30 0" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="2 3" />
    </g>
    <!-- Label -->
    <text x="760" y="800" font-size="34" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">cooperation</text>
  </g>

  <!-- Quadrant 4: impact (3D Wireframe Helical Coil Tunnel in Perspective) -->
  <g id="quad-04">
    <g id="geo-impact" transform="translate(1470, 640) rotate(-35)">
      <!-- 8 concentric-perspective ellipses simulating a wireframe spring coil tunnel -->
      <ellipse cx="-70" cy="0" rx="16" ry="32" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.4" />
      <ellipse cx="-50" cy="0" rx="20" ry="38" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5" />
      <ellipse cx="-30" cy="0" rx="24" ry="44" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.6" />
      <ellipse cx="-10" cy="0" rx="28" ry="50" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity="0.7" />
      <ellipse cx="10" cy="0" rx="32" ry="56" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8" />
      <ellipse cx="30" cy="0" rx="36" ry="62" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.9" />
      <ellipse cx="50" cy="0" rx="40" ry="68" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="1" />
      <ellipse cx="70" cy="0" rx="44" ry="74" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="1" />
      <!-- Tangent Envelope Lines -->
      <line x1="-70" y1="-32" x2="70" y2="-74" stroke="#8B949E" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
      <line x1="-70" y1="32" x2="70" y2="74" stroke="#8B949E" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />
    </g>
    <!-- Label -->
    <text x="1300" y="800" font-size="34" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">impact</text>
  </g>
</svg>
