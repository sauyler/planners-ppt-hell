<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Top Header -->
  <!-- Minimal Header -->
  <g id="header-block">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">COSMOS</text>
  </g>

  <!-- Main Art Stage: 3 Distinct Technical Panels (Direct Pin 05) -->
  <g id="triptych-panels">
    
    <!-- Panel 1: Land (Wireframe Sphere / Globe) -->
    <g id="panel-land">
      <rect x="700" y="240" width="340" height="520" fill="none" stroke="#21262D" stroke-width="1" />
      <text x="725" y="285" font-size="20" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">01 / LAND</text>
      <line x1="725" y1="305" x2="1015" y2="305" stroke="#1C2128" stroke-width="1" />

      <!-- Wireframe Globe Geometry -->
      <g id="globe-art" transform="translate(870, 500)">
        <circle cx="0" cy="0" r="105" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
        <!-- Equator & Latitudes -->
        <ellipse cx="0" cy="0" rx="105" ry="35" fill="none" stroke="#8B949E" stroke-width="1" stroke-dasharray="2 3" />
        <ellipse cx="0" cy="-52" rx="90" ry="22" fill="none" stroke="#484F58" stroke-width="0.8" />
        <ellipse cx="0" cy="52" rx="90" ry="22" fill="none" stroke="#484F58" stroke-width="0.8" />
        <!-- Longitudes -->
        <ellipse cx="0" cy="0" rx="42" ry="105" fill="none" stroke="#8B949E" stroke-width="1" />
        <line x1="0" y1="-105" x2="0" y2="105" stroke="#FFFFFF" stroke-width="1" />
        <line x1="-105" y1="0" x2="105" y2="0" stroke="#FFFFFF" stroke-width="1" />
        <circle cx="30" cy="-25" r="3.5" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Panel 2: Star (4-Point Radiant Vector Star & Crosshairs) -->
    <g id="panel-star">
      <rect x="1070" y="240" width="340" height="520" fill="none" stroke="#21262D" stroke-width="1" />
      <text x="1095" y="285" font-size="20" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">02 / STAR</text>
      <line x1="1095" y1="305" x2="1385" y2="305" stroke="#1C2128" stroke-width="1" />

      <!-- Radiant Star Geometry -->
      <g id="star-art" transform="translate(1240, 500)">
        <!-- Crosshairs -->
        <line x1="-120" y1="0" x2="120" y2="0" stroke="#383E47" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="0" y1="-120" x2="0" y2="120" stroke="#383E47" stroke-width="1" stroke-dasharray="3 3" />
        <!-- 4-pointed radiant star shape -->
        <path d="M 0 -95 Q 0 -18, 85 0 Q 0 18, 0 95 Q 0 18, -85 0 Q 0 -18, 0 -95 Z" fill="#FFFFFF" />
        <circle cx="0" cy="0" r="16" fill="none" stroke="#08090C" stroke-width="1.5" />
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      </g>
    </g>

    <!-- Panel 3: Galaxy (Orbital System with Planetary Ellipses) -->
    <g id="panel-galaxy">
      <rect x="1440" y="240" width="340" height="520" fill="none" stroke="#21262D" stroke-width="1" />
      <text x="1465" y="285" font-size="20" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">03 / GALAXY</text>
      <line x1="1465" y1="305" x2="1755" y2="305" stroke="#1C2128" stroke-width="1" />

      <!-- Orbital Ellipse System Geometry -->
      <g id="galaxy-art" transform="translate(1610, 500)">
        <!-- Core Center Sun -->
        <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
        <!-- Orbital ring 1 -->
        <ellipse cx="0" cy="0" rx="70" ry="28" fill="none" stroke="#8B949E" stroke-width="1.2" transform="rotate(-25)" />
        <circle cx="56" cy="-21" r="4.5" fill="#FFFFFF" />
        <!-- Orbital ring 2 -->
        <ellipse cx="0" cy="0" rx="108" ry="46" fill="none" stroke="#484F58" stroke-width="1" stroke-dasharray="3 3" transform="rotate(35)" />
        <circle cx="-75" cy="40" r="4.5" fill="#FFFFFF" />
        <!-- Orbital ring 3 -->
        <ellipse cx="0" cy="0" rx="130" ry="36" fill="none" stroke="#383E47" stroke-width="1" transform="rotate(-60)" />
        <circle cx="24" cy="85" r="3.5" fill="#8B949E" />
      </g>
    </g>

  </g>
</svg>
