<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Subtle Minimal Crosshair Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Main Art Stage: Directly Replicating Pin 02 (Tangled Mesh -> Engineered Node Matrix) -->
  <g id="tangle-to-grid-art">
    
    <!-- Organic Tangled Spline Cluster (Left side) -->
    <g id="tangled-lines" fill="none">
      <!-- Dark muted tangle foundation -->
      <path d="M 720 520 C 780 340, 940 360, 890 520 C 840 680, 1020 700, 980 500 C 940 300, 760 420, 820 620 C 880 820, 1080 640, 1040 460 C 1000 280, 820 320, 760 480" stroke="#383E47" stroke-width="1.2" opacity="0.6" />
      <path d="M 740 460 C 820 640, 980 620, 950 440 C 920 260, 760 380, 840 560 C 920 740, 1060 580, 1000 420 C 940 260, 860 460, 780 580 C 700 700, 920 740, 1020 560" stroke="#484F58" stroke-width="1" opacity="0.7" />
      
      <!-- Primary white and silver tangled curves -->
      <path d="M 760 540 C 860 380, 1000 420, 920 580 C 840 740, 720 600, 800 440 C 880 280, 1040 340, 980 520 C 920 700, 1060 680, 1080 500" stroke="#8B949E" stroke-width="1.2" opacity="0.85" />
      <path d="M 780 480 C 700 360, 880 300, 960 460 C 1040 620, 920 720, 840 600 C 760 480, 900 360, 1020 400 C 1140 440, 1080 660, 940 660 C 800 660, 860 500, 920 420" stroke="#C9D1D9" stroke-width="1.2" opacity="0.9" />
      <path d="M 820 420 C 920 280, 1060 360, 980 540 C 900 720, 780 640, 860 480 C 940 320, 1080 400, 1040 580 C 1000 760, 860 700, 920 560" stroke="#FFFFFF" stroke-width="1.4" opacity="0.95" />
      <path d="M 850 560 C 750 680, 890 740, 990 600 C 1090 460, 950 340, 850 440 C 750 540, 920 680, 1040 520 C 1160 360, 1000 280, 900 380" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />
      
      <!-- Fine micro-hairline loops -->
      <path d="M 880 460 C 940 380, 1020 420, 980 500 C 940 580, 860 540, 900 460" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
      <path d="M 940 520 C 1000 440, 1080 480, 1040 560 C 1000 640, 920 600, 960 520" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6" />
      
      <!-- Untangling Transition Bridges: Splines straighten horizontally into matrix -->
      <path d="M 1020 400 C 1080 400, 1140 400, 1240 400" stroke="#8B949E" stroke-width="1.2" />
      <path d="M 1080 500 C 1140 490, 1180 480, 1240 480" stroke="#8B949E" stroke-width="1.2" />
      <path d="M 1040 580 C 1100 570, 1160 560, 1240 560" stroke="#8B949E" stroke-width="1.2" />
      <path d="M 990 640 C 1060 640, 1140 640, 1240 640" stroke="#8B949E" stroke-width="1.2" />
    </g>

    <!-- Structured 4x4 Orthogonal Node Matrix (Right side) -->
    <g id="engineered-matrix">
      <!-- Horizontal Lines -->
      <line x1="1240" y1="400" x2="1510" y2="400" stroke="#383E47" stroke-width="1.2" />
      <line x1="1240" y1="480" x2="1510" y2="480" stroke="#383E47" stroke-width="1.2" />
      <line x1="1240" y1="560" x2="1510" y2="560" stroke="#383E47" stroke-width="1.2" />
      <line x1="1240" y1="640" x2="1510" y2="640" stroke="#383E47" stroke-width="1.2" />

      <!-- Vertical Lines -->
      <line x1="1240" y1="400" x2="1240" y2="640" stroke="#383E47" stroke-width="1.2" />
      <line x1="1330" y1="400" x2="1330" y2="640" stroke="#383E47" stroke-width="1.2" />
      <line x1="1420" y1="400" x2="1420" y2="640" stroke="#383E47" stroke-width="1.2" />
      <line x1="1510" y1="400" x2="1510" y2="640" stroke="#383E47" stroke-width="1.2" />

      <!-- 16 Precision Matrix Nodes with Subtle Lavender Glow Rings (Direct Pin 02 detail) -->
      <!-- Row 1 -->
      <circle cx="1240" cy="400" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1240" cy="400" r="3.5" fill="#FFFFFF" />
      <circle cx="1330" cy="400" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1330" cy="400" r="3.5" fill="#FFFFFF" />
      <circle cx="1420" cy="400" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1420" cy="400" r="3.5" fill="#FFFFFF" />
      <circle cx="1510" cy="400" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1510" cy="400" r="3.5" fill="#FFFFFF" />

      <!-- Row 2 -->
      <circle cx="1240" cy="480" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1240" cy="480" r="3.5" fill="#FFFFFF" />
      <circle cx="1330" cy="480" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1330" cy="480" r="3.5" fill="#FFFFFF" />
      <circle cx="1420" cy="480" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1420" cy="480" r="3.5" fill="#FFFFFF" />
      <circle cx="1510" cy="480" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1510" cy="480" r="3.5" fill="#FFFFFF" />

      <!-- Row 3 -->
      <circle cx="1240" cy="560" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1240" cy="560" r="3.5" fill="#FFFFFF" />
      <circle cx="1330" cy="560" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1330" cy="560" r="3.5" fill="#FFFFFF" />
      <circle cx="1420" cy="560" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1420" cy="560" r="3.5" fill="#FFFFFF" />
      <circle cx="1510" cy="560" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1510" cy="560" r="3.5" fill="#FFFFFF" />

      <!-- Row 4 -->
      <circle cx="1240" cy="640" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1240" cy="640" r="3.5" fill="#FFFFFF" />
      <circle cx="1330" cy="640" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1330" cy="640" r="3.5" fill="#FFFFFF" />
      <circle cx="1420" cy="640" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1420" cy="640" r="3.5" fill="#FFFFFF" />
      <circle cx="1510" cy="640" r="8" fill="none" stroke="#A371F7" stroke-width="1" opacity="0.7" />
      <circle cx="1510" cy="640" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- Direct Typographic Replicas from Pin 02 (Clean Headline Only) -->
    <g id="typography-block">
      <text x="1240" y="235" font-size="44" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">Your Content is Inconsistent.</text>
      <text x="1240" y="285" font-size="44" font-weight="800" fill="#A371F7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">Ours is Engineered.</text>
    </g>

    <!-- Bottom-right Brand Glyph (Direct Pin 02 Winged Glyph) -->
    <path d="M 1720 730 L 1740 760 L 1760 710 Z" fill="#FFFFFF" />

  </g>
</svg>
