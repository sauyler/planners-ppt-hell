<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Subtle Swiss Engineering Orthogonal Grid Background (Direct Pin 28) -->
  <g id="grid-pattern" opacity="0.35">
    <line x1="700" y1="200" x2="1800" y2="200" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="280" x2="1800" y2="280" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="360" x2="1800" y2="360" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="440" x2="1800" y2="440" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="520" x2="1800" y2="520" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="600" x2="1800" y2="600" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="680" x2="1800" y2="680" stroke="#161A20" stroke-width="1" />
    <line x1="700" y1="760" x2="1800" y2="760" stroke="#161A20" stroke-width="1" />

    <line x1="740" y1="160" x2="740" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="860" y1="160" x2="860" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="980" y1="160" x2="980" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="1100" y1="160" x2="1100" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="1220" y1="160" x2="1220" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="1340" y1="160" x2="1340" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="1460" y1="160" x2="1460" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="1580" y1="160" x2="1580" y2="820" stroke="#161A20" stroke-width="1" />
    <line x1="1700" y1="160" x2="1700" y2="820" stroke="#161A20" stroke-width="1" />
  </g>

  <!-- Four-Corner Registration Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Monumental Typography Block with Hand-drawn Loop (Direct Pin 28) -->
  <g id="quote-stage">
    <!-- Big Quote Display -->
    <text x="740" y="460" font-size="82" font-weight="900" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-1">“clarity is a</text>
    <text x="740" y="560" font-size="82" font-weight="900" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-1">deletion process”</text>

    <!-- Vector Hand-Drawn Oval Ellipse Looping Around "clarity is a" (Direct Pin 28) -->
    <path d="M 715 440 C 710 375, 1200 370, 1280 425 C 1330 470, 1240 505, 780 505 C 720 505, 715 470, 725 440" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Bottom Baseline with Single Traditional Vermilion Stamp -->
  <g id="bottom-seal-anchor">
    <line x1="700" y1="800" x2="1780" y2="800" stroke="#1C2128" stroke-width="1" />

    <!-- Traditional Vermilion Seal Stamp -->
    <g id="vermilion-stamp" transform="rotate(-3 1690 825)">
      <rect x="1610" y="774" width="170" height="52" rx="4" fill="#18080A" stroke="#D04848" stroke-width="2" />
      <rect x="1614" y="778" width="162" height="44" rx="2" fill="none" stroke="#D04848" stroke-width="0.8" stroke-dasharray="4 2" opacity="0.6" />
      <text x="1695" y="810" text-anchor="middle" font-size="24" font-weight="900" fill="#D04848" letter-spacing="4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">极简收敛</text>
    </g>
  </g>
</svg>
