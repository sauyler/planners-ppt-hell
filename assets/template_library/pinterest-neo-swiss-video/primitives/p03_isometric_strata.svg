<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pure Matte Obsidian Canvas -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Technical Marks -->
  <g opacity="0.2">
    <path d="M 680 80 L 700 80 M 690 70 L 690 90" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 80 L 1840 80 M 1830 70 L 1830 90" stroke="#484F58" stroke-width="1" />
    <path d="M 680 900 L 700 900 M 690 890 L 690 910" stroke="#484F58" stroke-width="1" />
    <path d="M 1820 900 L 1840 900 M 1830 890 L 1830 910" stroke="#484F58" stroke-width="1" />
  </g>

  <!-- Minimal Header -->
  <g id="header-block">
    <text x="700" y="190" font-size="38" font-weight="800" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="-0.5">STRATA</text>
  </g>

  <!-- Center Floating Isometric Rhombus Planes (Direct Pin 17 Geometry) -->
  <g id="isometric-stack">
    <!-- Vertical Curved Guidance Flow Arc on Left -->
    <path d="M 830 250 C 780 380, 780 540, 830 670" fill="none" stroke="#484F58" stroke-width="1.2" stroke-dasharray="3 3" />
    <polygon points="830,665 838,675 828,672" fill="#FFFFFF" />

    <!-- Layer 01: Top Solid Plate -->
    <g id="iso-plate-01">
      <polygon points="1060,195 1280,250 1060,305 840,250" fill="#E2E5EB" stroke="#FFFFFF" stroke-width="1.2" />
      <text x="1060" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#0E1015" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">TASTE &amp; JUDGMENT</text>
      <!-- Leader Line to Right -->
      <line x1="1280" y1="250" x2="1350" y2="250" stroke="#8B949E" stroke-width="1" />
      <circle cx="1350" cy="250" r="2.5" fill="#FFFFFF" />
      <text x="1370" y="256" font-size="22" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">01 / 心智</text>
    </g>

    <!-- Layer 02: Wireframe Plate -->
    <g id="iso-plate-02">
      <polygon points="1060,335 1280,390 1060,445 840,390" fill="#101319" stroke="#FFFFFF" stroke-width="1.2" opacity="0.85" />
      <text x="1060" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">CREATIVE DIRECTION</text>
      <!-- Leader Line to Right -->
      <line x1="1280" y1="390" x2="1350" y2="390" stroke="#484F58" stroke-width="1" />
      <circle cx="1350" cy="390" r="2.5" fill="#8B949E" />
      <text x="1370" y="396" font-size="22" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">02 / 策略</text>
    </g>

    <!-- Layer 03: Wireframe Plate -->
    <g id="iso-plate-03">
      <polygon points="1060,475 1280,530 1060,585 840,530" fill="#0C0E13" stroke="#8B949E" stroke-width="1" stroke-dasharray="3 2" opacity="0.75" />
      <text x="1060" y="536" text-anchor="middle" font-size="13" font-weight="600" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">THE BRAND / ARCHITECTURE</text>
      <!-- Leader Line to Right -->
      <line x1="1280" y1="530" x2="1350" y2="530" stroke="#484F58" stroke-width="1" />
      <circle cx="1350" cy="530" r="2.5" fill="#484F58" />
      <text x="1370" y="536" font-size="22" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">03 / 架构</text>
    </g>

    <!-- Layer 04: Bottom Wireframe Plate -->
    <g id="iso-plate-04">
      <polygon points="1060,615 1280,670 1060,725 840,670" fill="#080A0E" stroke="#484F58" stroke-width="1" opacity="0.65" />
      <text x="1060" y="676" text-anchor="middle" font-size="13" font-weight="600" fill="#383E47" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">THE BUSINESS / EXECUTION</text>
      <!-- Leader Line to Right -->
      <line x1="1280" y1="670" x2="1350" y2="670" stroke="#30363D" stroke-width="1" />
      <circle cx="1350" cy="670" r="2.5" fill="#383E47" />
      <text x="1370" y="676" font-size="22" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif">04 / 业务</text>
    </g>
  </g>
</svg>
