<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     data-speaker-width="620" data-caption-safe-height="160">
  <!-- Deep Matte Obsidian Blueprint Canvas
       安全区（硬约束）：x 0–620 为真人出镜列，底部 y 920–1080 为字幕区 —— 二者不得放内容。
       下游（Video Craft 的两支成片）按 data-speaker-width / data-caption-safe-height 避让。 -->
  <rect width="1920" height="1080" fill="#08090C" />

  <!-- Four-Corner Precision Engineering Registration Crosshairs (⌖) -->
  <g opacity="0.35">
    <!-- Top-Left Origin (X: 0680, Y: 0090) -->
    <path d="M 680 90 L 700 90 M 690 80 L 690 100" stroke="#8B949E" stroke-width="1" />
    <circle cx="690" cy="90" r="4" fill="none" stroke="#8B949E" stroke-width="0.75" />
    <text x="705" y="85" font-size="9" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X:0680 Y:0090</text>

    <!-- Top-Right Anchor (X: 1820, Y: 0090) -->
    <path d="M 1810 90 L 1830 90 M 1820 80 L 1820 100" stroke="#8B949E" stroke-width="1" />
    <circle cx="1820" cy="90" r="4" fill="none" stroke="#8B949E" stroke-width="0.75" />
    <text x="1805" y="85" text-anchor="end" font-size="9" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X:1820 Y:0090</text>

    <!-- Bottom-Left Anchor (X: 0680, Y: 0890) -->
    <path d="M 680 890 L 700 890 M 690 880 L 690 900" stroke="#8B949E" stroke-width="1" />
    <circle cx="690" cy="890" r="4" fill="none" stroke="#8B949E" stroke-width="0.75" />
    <text x="705" y="905" font-size="9" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X:0680 Y:0890</text>

    <!-- Bottom-Right Anchor (X: 1820, Y: 0890) -->
    <path d="M 1810 890 L 1830 890 M 1820 880 L 1820 900" stroke="#8B949E" stroke-width="1" />
    <circle cx="1820" cy="890" r="4" fill="none" stroke="#8B949E" stroke-width="0.75" />
    <text x="1805" y="905" text-anchor="end" font-size="9" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">X:1820 Y:0890</text>
  </g>

  <!-- Video Safe Zone Guides (Hairline Dashed Indicators) -->
  <g opacity="0.3">
    <!-- Presenter Cutout Boundary at x=620 -->
    <line x1="620" y1="90" x2="620" y2="920" stroke="#383E47" stroke-width="1" stroke-dasharray="4 6" />
    <!-- Subtitle Safe Boundary at y=920 -->
    <line x1="620" y1="920" x2="1860" y2="920" stroke="#383E47" stroke-width="1" stroke-dasharray="4 6" />
    <text x="635" y="945" font-size="10" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">SUBTITLE FLOOR SAFE ZONE (Y: 920 - 1080)</text>
    <text x="605" y="520" text-anchor="end" font-size="10" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1" transform="rotate(-90 605 520)">PRESENTER OCCLUSION ZONE (X: 0 - 620)</text>
  </g>

  <!-- Top Global Telemetry Header -->
  <g id="skyline-header">
    <text x="680" y="65" font-size="11" font-weight="700" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">00 / TECHNICAL SCHEMATIC SPECIFICATION · PRECISION DRAFTING</text>
    <text x="1820" y="65" text-anchor="end" font-size="11" font-weight="700" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1">1920 × 1080 · 16:9 VIDEO NATIVE</text>
    <line x1="680" y1="75" x2="1820" y2="75" stroke="#161A20" stroke-width="1" />
  </g>

  <!-- Center Active Graphics Stage Envelope (x: 680 ~ 1820, y: 120 ~ 880) -->
  <rect x="680" y="110" width="1140" height="760" fill="none" stroke="#161A20" stroke-width="1" stroke-dasharray="6 8" />
  <text x="1250" y="485" text-anchor="middle" font-size="22" font-weight="800" fill="#21262D" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" letter-spacing="1">ACTIVE HERO GRAPHIC ENVELOPE</text>
  <text x="1250" y="515" text-anchor="middle" font-size="12" fill="#21262D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">WIDTH: 1140PX · HEIGHT: 760PX · TOLERANCE: ±0.5PX</text>

  <!-- Global Footer Telemetry Rule -->
  <g id="skyline-footer">
    <line x1="680" y1="910" x2="1820" y2="910" stroke="#161A20" stroke-width="1" />
    <text x="680" y="930" font-size="10" fill="#484F58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ENGINEERING DRAFTING BLUEPRINT // FINE-LINE PRECISION</text>
    <text x="1820" y="930" text-anchor="end" font-size="10" font-weight="700" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PLANNER'S PPT HELL</text>
  </g>
</svg>
